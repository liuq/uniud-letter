name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: l3build check
    runs-on: ubuntu-latest
    container: ghcr.io/xu-cheng/texlive-full:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Regression tests
        run: l3build check

      - name: Test external asset installation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/uniud-assets /tmp/uniud-texmf
          cat > /tmp/asset.tex <<'TEX'
          \documentclass{article}
          \pagestyle{empty}
          \begin{document}\mbox{}\end{document}
          TEX
          xelatex -interaction=batchmode -halt-on-error -output-directory=/tmp /tmp/asset.tex
          for n in \
            uniud-letterhead-first \
            uniud-letterhead-first-dipartimento \
            uniud-letterhead-next \
            uniud-sigillo-completo
          do
            cp /tmp/asset.pdf "/tmp/uniud-assets/$n.pdf"
          done
          ./install-assets.sh --texmf /tmp/uniud-texmf /tmp/uniud-assets
          ./check-assets.sh --texmf /tmp/uniud-texmf

      - name: Build CTAN and TDS archives
        run: l3build ctan

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uniudletter-${{ github.sha }}
          if-no-files-found: error
          path: |
            uniudletter.zip
            uniudletter.tds.zip
          retention-days: 14
