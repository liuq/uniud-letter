name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag and package version
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG"
            echo "Expected format: vX.Y.Z"
            exit 1
          fi

          VERSION="${TAG#v}"

          if [[ ! -f VERSION ]]; then
            echo "VERSION file not found"
            exit 1
          fi

          PACKAGE_VERSION="$(tr -d '[:space:]' < VERSION)"

          if [[ "$PACKAGE_VERSION" != "$VERSION" ]]; then
            echo "Version mismatch"
            echo "Tag:     $VERSION"
            echo "VERSION: $PACKAGE_VERSION"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Release version: $VERSION"

      - name: Install TeX Live dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            texlive-xetex \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            latexmk \
            zip

          l3build --version
          xelatex --version | head -n 1

      - name: Run regression tests
        shell: bash
        run: |
          set -euo pipefail
          l3build check

      - name: Rebuild example PDFs
        shell: bash
        run: |
          set -euo pipefail

          # Remove the committed copies first: this makes the workflow prove
          # that every PDF can actually be regenerated from its .tex source.
          rm -f examples/uniud-example-digital.pdf \
                examples/uniud-example-analog.pdf \
                examples/uniud-example-dipartimento.pdf

          make examples

          test -s examples/uniud-example-digital.pdf
          test -s examples/uniud-example-analog.pdf
          test -s examples/uniud-example-dipartimento.pdf

      - name: Build CTAN and TDS packages
        shell: bash
        run: |
          set -euo pipefail
          l3build ctan

      - name: Prepare release artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          CTAN_ZIP="$(find . -type f -name 'uniudletter-ctan.zip' -print -quit)"
          TDS_ZIP="$(find . -type f -name 'uniudletter.tds.zip' -print -quit)"

          if [[ -z "$CTAN_ZIP" ]]; then
            echo "CTAN archive not found"
            find . -type f -name '*.zip' -print
            exit 1
          fi

          if [[ -z "$TDS_ZIP" ]]; then
            echo "TDS archive not found"
            echo
            echo "Make sure build.lua contains:"
            echo "  packtdszip = true"
            echo
            find . -type f -name '*.zip' -print
            exit 1
          fi

          cp "$CTAN_ZIP" \
            "release/uniudletter-${VERSION}-ctan.zip"

          cp "$TDS_ZIP" \
            "release/uniudletter-${VERSION}.tds.zip"

          cp examples/uniud-example-digital.pdf release/
          cp examples/uniud-example-analog.pdf release/
          cp examples/uniud-example-dipartimento.pdf release/

          (
            cd release

            sha256sum \
              "uniudletter-${VERSION}-ctan.zip" \
              "uniudletter-${VERSION}.tds.zip" \
              uniud-example-digital.pdf \
              uniud-example-analog.pdf \
              uniud-example-dipartimento.pdf \
              > SHA256SUMS
          )

          echo
          echo "Release artifacts:"
          ls -lh release

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release create "$GITHUB_REF_NAME" \
            --title "uniudletter ${VERSION}" \
            --generate-notes \
            "release/uniudletter-${VERSION}-ctan.zip" \
            "release/uniudletter-${VERSION}.tds.zip" \
            "release/uniud-example-digital.pdf" \
            "release/uniud-example-analog.pdf" \
            "release/uniud-example-dipartimento.pdf" \
            "release/SHA256SUMS"
