name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag and package version
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG"
            echo "Expected format: vX.Y.Z"
            exit 1
          fi

          VERSION="${TAG#v}"

          if [[ ! -f VERSION ]]; then
            echo "VERSION file not found"
            exit 1
          fi

          PACKAGE_VERSION="$(tr -d '[:space:]' < VERSION)"

          if [[ "$PACKAGE_VERSION" != "$VERSION" ]]; then
            echo "Version mismatch"
            echo "Tag:     $VERSION"
            echo "VERSION: $PACKAGE_VERSION"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Release version: $VERSION"

      - name: Install TeX Live dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            texlive-xetex \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            latexmk \
            zip

          l3build --version
          xelatex --version | head -n 1

      - name: Run regression tests
        shell: bash
        run: |
          set -euo pipefail
          l3build check

      - name: Build CTAN package
        shell: bash
        run: |
          set -euo pipefail
          l3build ctan

      - name: Prepare release artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          CTAN_ZIP="$(find . -maxdepth 2 -type f -name 'uniudletter-ctan.zip' | head -n 1)"
          TDS_ZIP="$(find . -maxdepth 2 -type f -name 'uniudletter.tds.zip' | head -n 1)"

          if [[ -z "$CTAN_ZIP" || ! -f "$CTAN_ZIP" ]]; then
            echo "CTAN archive not found"
            find . -maxdepth 3 -type f -name '*.zip' -print
            exit 1
          fi

          if [[ -z "$TDS_ZIP" || ! -f "$TDS_ZIP" ]]; then
            echo "TDS archive not found"
            find . -maxdepth 3 -type f -name '*.zip' -print
            exit 1
          fi

          cp "$CTAN_ZIP" \
            "release/uniudletter-${VERSION}-ctan.zip"

          cp "$TDS_ZIP" \
            "release/uniudletter-${VERSION}.tds.zip"

          (
            cd release
            sha256sum \
              "uniudletter-${VERSION}-ctan.zip" \
              "uniudletter-${VERSION}.tds.zip" \
              > SHA256SUMS
          )

          echo
          echo "Release artifacts:"
          ls -lh release

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release create "$GITHUB_REF_NAME" \
            --title "uniudletter ${VERSION}" \
            --generate-notes \
            "release/uniudletter-${VERSION}-ctan.zip" \
            "release/uniudletter-${VERSION}.tds.zip" \
            "release/SHA256SUMS"